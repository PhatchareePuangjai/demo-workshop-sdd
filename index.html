<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8dfbf">
  <title>บันทึกรายรับ-รายจ่าย</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="app-header">
    <h1 id="app-title">บันทึกรายรับ-รายจ่าย</h1>
  </header>

  <main class="app-main">

    <!-- ฟอร์มเพิ่มข้อมูล (Create) -->
    <section class="card" id="form-section">
      <h2 class="section-title">เพิ่มรายการใหม่</h2>

      <form id="item-form" class="form" autocomplete="off" novalidate>
        <input
          type="text"
          id="input-name"
          class="input"
          placeholder="ชื่อรายการ"
        >
        <input
          type="number"
          id="input-amount"
          class="input"
          step="any"
          inputmode="decimal"
          placeholder="จำนวนเงิน (บาท)"
        >
        <select id="input-type" class="select">
          <option value="expense" selected>รายจ่าย</option>
          <option value="income">รายรับ</option>
        </select>
        <select id="input-category" class="select">
          <option value="food">อาหาร</option>
          <option value="travel">เดินทาง</option>
          <option value="shopping">ช้อปปิ้ง</option>
          <option value="other" selected>อื่น ๆ</option>
        </select>
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </form>

      <p id="form-error" class="form-error" hidden></p>
    </section>

    <!-- สรุปตัวเลขแบบเรียลไทม์ -->
    <section class="card summary" id="summary-section">
      <div id="summary-text">
        <div class="summary-item">
          <span class="summary-label">รายรับรวม</span>
          <span class="summary-value" id="summary-income"></span>
        </div>
        <div class="summary-item">
          <span class="summary-label">รายจ่ายรวม</span>
          <span class="summary-value" id="summary-expense"></span>
        </div>
        <div class="summary-item">
          <span class="summary-label">ยอดคงเหลือ</span>
          <span class="summary-value" id="summary-balance"></span>
        </div>
      </div>
    </section>

    <!-- ตัวกรอง (Filter) -->
    <section class="filters" id="filter-section">
      <button type="button" class="btn btn-filter is-active" data-filter="all">ทั้งหมด</button>
      <button type="button" class="btn btn-filter" data-filter="income">เฉพาะรายรับ</button>
      <button type="button" class="btn btn-filter" data-filter="expense">เฉพาะรายจ่าย</button>
    </section>

    <!-- ลิสต์รายการ + empty state -->
    <section class="card" id="list-section">
      <ul id="item-list" class="item-list"></ul>

      <p id="empty-state" class="empty-state"></p>
    </section>

    <!-- ปุ่มจัดการทั้งชุด -->
    <section class="actions">
      <button type="button" id="btn-clear" class="btn btn-danger">ล้างข้อมูลทั้งหมด</button>
    </section>

  </main>

  <script src="./app.js"></script>
</body>
</html>
