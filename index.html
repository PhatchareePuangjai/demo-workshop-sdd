<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcard Vocabulary App</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="app-header">
    <h1>บัตรคำศัพท์</h1>
    <p>เรียนรู้คำศัพท์ด้วยเทคนิคการพลิกบัตร</p>
  </header>

  <main class="app-main">

    <!-- 1) ฟอร์มเพิ่มข้อมูล -->
    <section class="card" id="form-section">
      <h2 class="section-title">เพิ่มคำศัพท์ใหม่</h2>
      <form id="item-form" class="form" autocomplete="off">
        <input type="text" id="input-vocab" class="input" placeholder="คำศัพท์ (Front)..." required>
        <input type="text" id="input-translation" class="input" placeholder="คำแปล (Back)..." required>
        <button type="submit" class="btn btn-primary">เพิ่มบัตร</button>
      </form>
      <p id="form-error" class="form-error" hidden></p>
    </section>

    <!-- 2) สรุปตัวเลข + ล้างบัตร -->
    <section class="card summary" id="summary-section">
      <p id="summary-text">ยังไม่มีคำศัพท์</p>
      <button type="button" id="btn-clear" class="btn btn-danger">ล้างบัตรที่จำได้แล้ว</button>
    </section>

    <!-- 3) ตัวกรอง -->
    <section class="filters" id="filter-section">
      <button type="button" class="btn btn-filter is-active" data-filter="all">ทั้งหมด</button>
      <button type="button" class="btn btn-filter" data-filter="not_memorized">ยังไม่จำ</button>
      <button type="button" class="btn btn-filter" data-filter="memorized">จำได้แล้ว</button>
    </section>

    <!-- 4) ส่วนแสดงบัตร (Carousel) -->
    <section class="card" id="review-section">
      <div id="carousel"></div>
      <div class="navigation">
        <button id="btn-prev" class="btn">ก่อนหน้า</button>
        <button id="btn-next" class="btn">ถัดไป</button>
      </div>
    </section>

    <!-- 5) ลิสต์รายการ (สำหรับจัดการ) -->
    <section class="card" id="list-section">
      <h2 class="section-title">รายการคำศัพท์ทั้งหมด</h2>
      <ul id="item-list" class="item-list"></ul>
      <p id="empty-state" class="empty-state" hidden>ยังไม่มีบัตรคำ เริ่มสร้างคำศัพท์แรกของคุณได้เลย!</p>
    </section>

  </main>

  <script src="./app.js"></script>
</body>
</html>
</html>
